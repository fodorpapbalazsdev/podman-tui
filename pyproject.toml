[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "podman-tui"
version = "0.1.0"
description = "A TUI for managing Podman containers"
requires-python = ">=3.10"
dependencies = [
    "textual>=0.60.0",
    "pyyaml>=6.0",
    "rich>=13.0.0",
]

[project.scripts]
podman-tui = "podman_tui.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/podman_tui"]

[dependency-groups]
dev = [
    "pytest>=7.0",
    "black>=23.0",
    "ruff>=0.1.0",
]

